[tool.poetry]
name = "newsroom-backend"
version = "0.1.0"
description = "AI-Powered Autonomous Newsroom Platform"
authors = ["Newsroom Team"]

[tool.poetry.dependencies]
python = "^3.12"

# Web framework
fastapi = "^0.115"
uvicorn = {extras = ["standard"], version = "^0.30"}
sse-starlette = "^2.1"
websockets = "^13.0"
python-multipart = "^0.0.9"

# LangGraph + LLM
langgraph = "^0.2"
langgraph-checkpoint-postgres = "^2.0"
langchain-anthropic = "^0.3"
langchain-core = "^0.3.17"
anthropic = "^0.40"

# Database
sqlalchemy = {extras = ["asyncio"], version = "^2.0"}
asyncpg = "^0.30"
alembic = "^1.14"
psycopg2-binary = "^2.9"

# Redis
redis = {extras = ["hiredis"], version = "^5.0"}

# Celery
celery = {extras = ["redis"], version = "^5.4"}

# News discovery
feedparser = "^6.0"
newspaper3k = "^0.2"
playwright = "^1.48"
newsapi-python = "^0.2"
httpx = "^0.27"

# Verification
gdeltdoc = "^1.6"

# Media
pillow = "^11.0"
openai = "^1.0"

# Auth
python-jose = {extras = ["cryptography"], version = "^3.3"}
passlib = {extras = ["bcrypt"], version = "^1.7"}
cryptography = "^43"

# Validation
pydantic = {extras = ["email"], version = "^2.8"}
pydantic-settings = "^2.4"

# Observability
structlog = "^24.4"

# Utilities
python-ulid = "^2.0"
tenacity = "^9.0"
python-dateutil = "^2.9"

[tool.poetry.dev-dependencies]
pytest = "^8.3"
pytest-asyncio = "^0.24"
httpx = "^0.27"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
