services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: newsroom
      POSTGRES_PASSWORD: newsroom_secret
      POSTGRES_DB: newsroom_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newsroom -d newsroom_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://newsroom:newsroom_secret@postgres:5432/newsroom_db
      DATABASE_URL_SYNC: postgresql+psycopg2://newsroom:newsroom_secret@postgres:5432/newsroom_db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - media_storage:/app/media
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080 --reload

  celery-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://newsroom:newsroom_secret@postgres:5432/newsroom_db
      DATABASE_URL_SYNC: postgresql+psycopg2://newsroom:newsroom_secret@postgres:5432/newsroom_db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - media_storage:/app/media
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=4

  celery-beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://newsroom:newsroom_secret@postgres:5432/newsroom_db
      DATABASE_URL_SYNC: postgresql+psycopg2://newsroom:newsroom_secret@postgres:5432/newsroom_db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: celery -A app.workers.celery_app beat --loglevel=info

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8080
      NEXT_PUBLIC_WS_URL: ws://backend:8080
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/next.config.mjs:/app/next.config.mjs

volumes:
  postgres_data:
  redis_data:
  media_storage:
